name: Block Internal PRs

on:
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  block-internal-prs:
    name: Block Internal PRs
    # Only run if PR is from the same repo (not a fork).
    #
    # FORK EXEMPTION (blairsilverberg/gastown): PRs carrying the `automerge`
    # label are exempt. Upstream's policy is that Gas Town agents push straight
    # to main and PRs are for external contributors — but on this fork agents
    # land work through the automerge path (.github/workflows/automerge.yml),
    # which requires a PR to attach the label, pass the guard, and go green
    # first. That is a stricter route than pushing directly to main, not a
    # looser one, so closing those PRs would remove checks rather than add any.
    # Everything unlabelled is still closed exactly as before.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'renovate[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close PR and comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const prNumber = context.issue.number;
            const branch = context.payload.pull_request.head.ref;

            const body = [
              '**Internal PRs are not allowed.**',
              '',
              'Gas Town agents push directly to main. PRs are for external contributors only.',
              '',
              'To land your changes:',
              '```bash',
              'git checkout main',
              'git merge ' + branch,
              'git push origin main',
              'git push origin --delete ' + branch,
              '```',
              '',
              'See CLAUDE.md: "Crew workers push directly to main. No feature branches. NEVER create PRs."'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed'
            });

            core.setFailed('Internal PR blocked. Push directly to main instead.');
